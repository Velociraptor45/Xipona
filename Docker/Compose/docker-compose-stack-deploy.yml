version: "3.7"

services:
  Database:
    image: postgres:17
    environment:
      POSTGRES_DB: xipona
      POSTGRES_USER_FILE: /run/secrets/xipona-db-username
      POSTGRES_PASSWORD_FILE: /run/secrets/xipona-db-password
    ports:
      - "15909:3306"
    networks: 
      - xipona
    volumes:
      - xipona-database:/var/lib/postgresql/data
    secrets:
      - xipona-db-username
      - xipona-db-password

  Api:
    image: velocir4ptor/xipona-api:0.13.1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      XIPONA_DB_USERNAME_FILE: /run/secrets/xipona-db-username
      XIPONA_DB_PASSWORD_FILE: /run/secrets/xipona-db-password
      # XIPONA_OTEL_API_KEY_FILE: /run/secrets/xipona-otel-api-key # uncomment this for backend OTEL API key support
      # XIPONA_VAULT_USERNAME_FILE: /run/secrets/xipona-vault-api-username # uncomment this for vault support
      # XIPONA_VAULT_PASSWORD_FILE: /run/secrets/xipona-vault-api-password
      # XIPONA_VAULT_URI: https://myvault.example
      # XIPONA_VAULT_MOUNT_POINT: xipona
      # "XIPONA_VAULT_PATHS_DATABASE: database
      # XIPONA_VAULT_PATHS_LOGGING: logging
    ports:
      - "12489:80"
    depends_on:
      - Database
    volumes:
      # - xipona-api-tls:/app/ssl:ro # uncomment this for https support, see readme
      - xipona-api-config:/app/config:ro
    networks:
      - xipona
    secrets:
      - xipona-db-username
      - xipona-db-password
      # - xipona-otel-api-key # uncomment this for backend OTEL API key support
      # - xipona-vault-api-username # uncomment this for vault support
      # - xipona-vault-api-password

  # LogCollector: # uncomment this for frontend log support
  #   image: velocir4ptor/web-assembly-log-collector:1.0.0
  #   ports:
  #     - "13880:80"
  #   volumes:
  #     - xipona-log-collector-config:/app/config:ro
  #     - xipona-log-collector-logs:/app/logs
  #   networks:
  #     - xipona

  Frontend:
    image: velocir4ptor/xipona-frontend:0.13.1
    ports:
      - "14000:80"
    depends_on:
      - Api
    volumes:
      - xipona-frontend-config:/etc/nginx/conf.d:ro
      - {CONFIG_FOLDER_PATH}/appsettings.Production.json:/usr/share/nginx/html/wwwroot/appsettings.Production.json:ro
      # - xipona-frontend-tls:/etc/nginx/ssl:ro # uncomment this for https support, see readme
    networks:
      - xipona

volumes:
  # xipona-frontend-tls: # uncomment this for https support, see readme
  #   external: true
  # xipona-api-tls:
  #   external: true
  xipona-frontend-config:
    external: true
  xipona-api-logs:
    external: true
  xipona-api-config:
    external: true
  xipona-database:
    external: true
  # xipona-log-collector-config: # uncomment this for frontend log support
  #   external: true
  # xipona-log-collector-logs:
  #   external: true

networks:
  xipona:
    name: xipona

secrets:
  xipona-db-username:
    external: true
  xipona-db-password:
    external: true
  # xipona-otel-api-key: # uncomment this for backend OTEL API key support
  #   external: true